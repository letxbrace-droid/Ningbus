name: Arbitre (Android)

# Construit l'APK à chaque modification du dossier arbitre/, et le publie en
# artefact téléchargeable : pas besoin d'Android Studio pour installer l'app.
on:
  push:
    paths:
      - "arbitre/**"
      - ".github/workflows/arbitre.yml"
  pull_request:
    paths:
      - "arbitre/**"
  workflow_dispatch:

jobs:
  construire:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbitre

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Rendre le wrapper exécutable
        run: chmod +x gradlew

      # Le moteur de calcul est du Kotlin pur : il se teste sans émulateur,
      # et c'est lui qui décide si une course est rentable.
      - name: Tester le moteur d'arbitrage
        run: ./gradlew :moteur:test

      - name: Construire l'APK de débogage
        run: ./gradlew :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: arbitre-debug-apk
          path: arbitre/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-moteur
          path: arbitre/moteur/build/reports/tests/test
          if-no-files-found: ignore

  # Le banc d'essai : Arbitre face à une vraie carte d'offre, sur un vrai
  # Android. Toutes les pannes rencontrées vivaient dans la plomberie — la
  # mauvaise fenêtre lue, l'arbre des vues tronqué, la carte pas encore
  # dessinée — et aucun test unitaire ne pouvait les voir.
  banc-essai:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: arbitre

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Sans accélération matérielle, l'émulateur est trop lent pour être
      # utilisable : les essais expireraient avant le démarrage du système.
      - name: Activer KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rendre le wrapper exécutable
        run: chmod +x gradlew

      - name: Jouer le parcours complet sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: arbitre
          # Gradle ne montre que la première ligne d'un message d'assertion.
          # Les résultats XML, eux, portent le message entier : sans ce
          # vidage, un échec sur émulateur coûte un aller-retour complet
          # rien que pour savoir ce qu'il disait.
          script: |
            ./gradlew :simulateur:installDebug
            set +e
            ./gradlew :app:connectedDebugAndroidTest
            CODE=$?
            set -e
            echo "===================== RÉSULTATS DÉTAILLÉS ====================="
            find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} \; || true
            echo "===================== LOGCAT ARBITRE =========================="
            adb logcat -d -s Arbitre:V BancEssai:V || true
            exit $CODE

      - name: Publier le rapport du banc d'essai
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-banc-essai
          path: arbitre/app/build/reports/androidTests
          if-no-files-found: ignore
