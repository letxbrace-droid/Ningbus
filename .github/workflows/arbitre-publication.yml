name: Arbitre — publication

# Publie l'APK en Release, c'est-à-dire en téléchargement direct : un lien
# .apk qui s'ouvre sans compte GitHub et sans dézippage, donc installable
# depuis le téléphone en un appui. Les artefacts de la CI, eux, exigent
# d'être connecté et livrent un .zip.
#
# Déclenchement : pousser une étiquette « arbitre-vX.Y ».
#   git tag arbitre-v1.0 && git push origin arbitre-v1.0
on:
  push:
    tags:
      - "arbitre-v*"

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbitre

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Rendre le wrapper exécutable
        run: chmod +x gradlew

      # On ne publie pas un APK dont le moteur d'arbitrage n'a pas été vérifié.
      - name: Tester le moteur d'arbitrage
        run: ./gradlew :moteur:test

      - name: Construire l'APK
        run: ./gradlew :app:assembleDebug

      - name: Nommer l'APK d'après l'étiquette
        run: |
          version="${GITHUB_REF_NAME#arbitre-v}"
          cp app/build/outputs/apk/debug/app-debug.apk "arbitre-$version.apk"
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'TEXTE'
          Widget d'arbitrage des courses : il lit la notification d'une offre,
          calcule ce qu'elle laisse réellement par heure de travail et affiche
          un verdict par-dessus l'application chauffeur.

          ## Installer

          1. Télécharger `arbitre-VERSION.apk` ci-dessous depuis le téléphone.
          2. L'ouvrir ; autoriser « installer des applications inconnues » pour
             le navigateur si Android le demande.
          3. Au premier lancement, accorder les deux permissions depuis
             l'écran d'accueil : **accès aux notifications** et
             **superposition d'écran**.
          4. Cocher son application chauffeur, régler son barème, puis
             **« Essayer avec une course fictive »** pour placer la bulle.

          Rien ne sort du téléphone : aucune permission réseau dans le
          manifeste, aucun compte, aucun serveur.

          ## À savoir

          Build de débogage, signé avec la clé de débogage du dépôt. Elle est
          fixe, donc les versions suivantes s'installeront par-dessus celle-ci
          sans désinstallation et sans perte de réglages.

          Documentation complète : [`arbitre/README.md`](https://github.com/letxbrace-droid/Ningbus/blob/ETIQUETTE/arbitre/README.md)
          TEXTE
          sed -i "s/arbitre-VERSION.apk/arbitre-${version}.apk/; s|ETIQUETTE|${GITHUB_REF_NAME}|" notes.md
          gh release create "$GITHUB_REF_NAME" "arbitre-${version}.apk" \
            --title "Arbitre ${version}" \
            --notes-file notes.md
