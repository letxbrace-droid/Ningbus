name: Arbitre — publication

# Publie l'APK en Release, c'est-à-dire en téléchargement direct : sur un
# dépôt public, un fichier de Release s'ouvre sans compte GitHub et sans
# dézippage, donc s'installe depuis le téléphone en un appui. Les artefacts
# de la CI, eux, exigent d'être connecté et livrent un .zip.
#
# Déclenchement : modifier arbitre/VERSION et pousser. Le numéro qu'il
# contient donne le nom de la Release et de l'étiquette, que le workflow
# crée lui-même. Publier une nouvelle version tient donc en un chiffre.
on:
  push:
    paths:
      - "arbitre/VERSION"
      # Les notes d'installation vivent dans ce fichier : les corriger doit
      # suffire à rectifier la Release, sans inventer un numéro de version.
      - ".github/workflows/arbitre-publication.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbitre

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Rendre le wrapper exécutable
        run: chmod +x gradlew

      # On ne publie pas un APK dont le moteur d'arbitrage n'a pas été vérifié.
      - name: Tester le moteur d'arbitrage
        run: ./gradlew :moteur:test

      - name: Construire l'APK
        run: ./gradlew :app:assembleDebug

      - name: Nommer l'APK d'après VERSION
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          if [ -z "$version" ]; then
            echo "arbitre/VERSION est vide" >&2
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "arbitre-${version}.apk"
          {
            echo "version=$version"
            echo "etiquette=arbitre-v${version}"
          } >> "$GITHUB_ENV"

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'TEXTE'
          Widget d'arbitrage des courses : il repère l'offre qui arrive,
          calcule ce qu'elle laisse réellement par heure de travail — approche
          à vide, bouchons, retour à vide, coût au kilomètre — et pose un
          verdict par-dessus l'application chauffeur.

          ## Installer

          1. Télécharger `arbitre-VERSION.apk` ci-dessous, depuis le téléphone.
          2. L'ouvrir ; autoriser « installer des applications inconnues » pour
             le navigateur si Android le demande.
          3. Au premier lancement, accorder les **trois** permissions depuis
             l'écran d'accueil :
             - **lecture de l'écran** (accessibilité) — la plus importante :
               quand l'application chauffeur est au premier plan, Uber affiche
               son offre sans envoyer aucune notification. Sans cette
               permission, ces courses-là passent inaperçues ;
             - **accès aux notifications** — pour les offres reçues
               application en arrière-plan ou écran verrouillé ;
             - **superposition d'écran** — pour dessiner la bulle.
          4. Régler son barème, puis **« Essayer avec une course fictive »**
             pour placer la bulle.

          Rien à cocher dans le cas courant : Uber, Bolt, Heetch, FreeNow,
          Marcel et Caocao sont écoutés d'origine. Si ton application
          chauffeur manque, le **mode découverte** donne son nom exact dès
          qu'elle envoie quelque chose, et il suffit alors de la cocher.

          « Écouter toutes les applications » existe pour ce cas, et doit être
          éteint ensuite. Sur une vraie journée avec ce mode allumé, 55
          verdicts sur 80 portaient sur autre chose qu'une course — l'écran
          d'accueil, une boîte mail, une conversation. Cette version le rend
          beaucoup moins nuisible, mais elle ne le rend pas utile.

          Une **pastille « €/h »** reste à l'écran : un appui analyse l'écran
          tel qu'il est. C'est le chemin qui ne dépend d'aucune détection — si
          une offre passe inaperçue, il répond quand même. Glisse-la où elle
          ne gêne pas le bouton d'acceptation.

          L'écran d'accueil montre l'**état réel des services** : Android peut
          délier un service tout en le laissant « autorisé » dans ses
          réglages, et c'est la panne la plus déroutante.

          Ces permissions sont larges par nature. Ce qui les borne : **rien ne
          sort du téléphone** — aucun compte, aucun serveur, et aucune
          permission réseau dans le manifeste.

          ## Ce que cette version ajoute

          **L'appli mesure de combien les plateformes se trompent.** Tu le
          savais déjà — les durées annoncées sont optimistes, et un chauffeur
          qui accepte sur cette base travaille plus longtemps qu'il ne l'a
          décidé. Le moteur majorait bien les durées en circulation chargée,
          mais avec un coefficient **supposé**, et qui vaut exactement 1,0
          au-dessus de 45 km/h : le cas le plus courant — une longue course
          annoncée 45 min qui en prend 52 sur des axes dégagés — lui échappait
          entièrement.

          Les deux chiffres existaient pourtant déjà sur le téléphone. La carte
          d'offre annonce une durée ; l'écran **« Détails de la course »**
          constate celle qui a été passée. L'appli les rapproche sur le prix,
          qui ne bouge pas entre les deux, et en tire un coefficient
          **mesuré** — propre à ce chauffeur, à son secteur et à ses heures.
          Aucun réseau, aucun GPS, aucune permission nouvelle : ce sont les
          chiffres de la plateforme, retournés contre ses propres estimations.

          Trois précautions, une par façon de se tromper. **La médiane et non
          la moyenne**, pour qu'une course interrompue ne déplace rien. **Cinq
          rapprochements minimum** avant de conclure quoi que ce soit — trois
          courses ne décrivent pas une plateforme. Et **des bornes** : si la
          mesure sort de l'intervalle 0,75–1,75, c'est l'appariement qui est
          faux, pas la plateforme qui ment d'un facteur trois. Le coefficient
          **remplace** la majoration supposée au lieu de s'y ajouter : les deux
          répondent à la même question, les empiler compterait deux fois.

          Les réglages affichent l'état en clair — « 3 courses rapprochées sur
          5 — rien n'est corrigé pour l'instant », puis « Uber sous-estime tes
          trajets de 18 % (12 courses) ». Un réglage qui ne fait rien doit dire
          qu'il ne fait rien.

          Une limite assumée : la correction ne porte que sur le trajet payé,
          jamais sur l'approche. Les plateformes ne facturent pas l'approche,
          donc elles ne l'archivent pas — il n'existe aucune durée réelle
          d'approche à confronter à l'annonce. La carte d'offre est le seul
          instant où ce chiffre existe, et le journal d'Arbitre le seul endroit
          où il survit.

          ## Ce que cette version corrige

          **Le compteur « prises » ne comptait pas les courses prises.** Il
          affichait « 1 prise (4 %) » alors qu'il dénombre les verdicts
          PRENDS, c'est-à-dire ce que le moteur a **conseillé** : l'application
          ne sait pas ce qui a été accepté, l'offre disparaît de l'écran dans
          les deux cas. Le mot suggérait un taux d'acceptation, donc un
          jugement sur le chauffeur, là où le chiffre juge les offres reçues.
          Il dit maintenant **« à prendre »**.

          ## Ce que la version précédente ajoutait

          **Le budget d'approche, sur les offres en direct.** Quand l'offre
          n'annonce pas d'approche — le cas le plus fréquent chez Uber — le
          verdict était calculé comme si le client attendait devant la porte,
          et se contentait de prévenir qu'il était « optimiste ». Un
          avertissement ne se transforme pas en décision. La bulle donne
          désormais le chiffre qui tranche : **« rentable jusqu'à 1,7 km
          d'approche »**. Le chauffeur a la carte sous les yeux et sait où est
          le client ; un seul kilométrage lui suffit.

          Une course relevée à Breuillet le dit mieux qu'un raisonnement :
          9,00 € pour 3,10 km en 7 min 42, soit 2,90 € du kilomètre — le genre
          de course qu'on accepte sans réfléchir. Elle paie **39 €/h** si le
          client est devant la porte et **20 €/h** s'il est à trois kilomètres.
          Le prix, la distance, la durée et l'euro/kilomètre sont identiques
          dans les deux cas. À cinq kilomètres d'approche elle affiche encore
          1,11 €/km — au-dessus du seuil que tout le monde utilise — et paie
          17 €/h.

          ## Ce que la version précédente corrigeait

          **Un prix impossible ne passe plus au vert.** Une carte relevée le
          25/09 a été arbitrée sur un montant de **4 768,00 €** pour 47,7 km,
          soit 90,47 €/km et 3 815 €/h — et rendue en PRENDS, avec 100 % de
          confiance et 90/100 au score d'offre. Tous les autres chiffres
          étaient justes au centime près ; un seul ne l'était pas, et il
          suffisait à recommander une course qu'il fallait refuser.

          C'est la faille déjà rencontrée à Grigny : la confiance mesurait si
          les champs étaient **remplis**, jamais s'ils étaient **vrais**, et un
          montant aberrant est un champ rempli. Le moteur vérifie désormais
          qu'une somme peut être un prix — deux plafonds, l'un absolu pour les
          courses courtes, l'autre au kilomètre pour les longues, de sorte
          qu'un Paris–Deauville à 250 € passe et qu'un 80 € sur 3 km non.
          Quand le montant est refusé, le verdict devient INCOMPLET et nomme ce
          qu'il a lu, en proposant la lecture probable — « 4768,00 € pour
          47,7 km — sans doute 47,68 € », le séparateur décimal perdu étant de
          loin la panne la plus fréquente. **Proposée, jamais appliquée** :
          corriger d'office ferait décider le moteur sur une hypothèse, ce
          qu'on lui reproche précisément ici.

          **L'avertissement de zone morte.** Le barème suppose un
          repositionnement moyen de 35 % du trajet. C'est juste sur une
          journée entière et faux sur une course en particulier : une dépose au
          fond d'un secteur qui ne redemande rien coûte le retour **complet** à
          vide. Sur la course du 25/09, l'écart est de 26 €/h à 15 €/h — de
          part et d'autre de l'objectif. La bulle affiche maintenant ce second
          chiffre, mais seulement quand il contredit le verdict. Le moteur ne
          sait pas quelles zones sont mortes ; il donne le chiffre, et laisse
          trancher celui qui connaît son secteur.

          Enfin, la bulle réduite n'affiche plus « — INCOMPLET » sans un mot :
          à défaut d'euro/heure, c'est le motif qui prend la place.

          ## Et avant cela : le cockpit

          **Un cockpit, et non plus un tableau.** L'accueil porte un en-tête
          avec sa marque, son numéro de version et un point d'état. La carte
          de service **rayonne de sa couleur** — vert, ambre ou rouge — et ses
          trois voyants à icône, écran, image, détection, ouvrent chacun ce
          qu'il faut pour se rallumer.

          La carte du verdict porte son halo, sa pastille signée — ✓ pour
          prendre, ✕ pour laisser — et **neuf valeurs en tuiles à icône** au
          lieu de neuf chiffres nus. Dans une grille, l'œil retrouve « le
          carburant » à sa tuile bien avant d'avoir lu la légende, et c'est
          cette relecture-là qu'on fait au feu rouge. La confiance devient un
          anneau : 93 % se lit, un anneau presque fermé se voit.

          **De vrais interrupteurs.** Les onze réglages passent au modèle
          Material 3 : piste pleine à la couleur d'accent, pouce qui grossit
          en s'allumant. Le petit rail d'avant se confondait d'un état à
          l'autre — au volant, « je crois que c'est activé » n'est pas une
          réponse.

          **Du mouvement, et rien que le nécessaire.** La bascule d'onglet
          fond en deux cents millisecondes, sans quoi l'œil ne sait pas s'il a
          changé d'onglet ou si l'application a sauté. La bulle descend en
          place au lieu de surgir, parce qu'elle apparaît par-dessus une
          application qu'on est en train de regarder. La pastille pulse quand
          le verdict change, puisqu'elle vit hors du champ où le regard
          travaille. Rien ne dépasse un tiers de seconde : au-delà, une
          transition cesse d'être une réponse et devient une animation qu'on
          subit.

          Le **simulateur ne se reconstruit plus** à chaque pixel de curseur —
          c'est ce qui lui donnait sa sensation poisseuse. La barre d'onglets
          **flotte** au lieu d'être collée en bas, où elle se confondait avec
          le trait de navigation du système.

          ## Ce que les versions d'avant corrigeaient

          **Le numéro de version affiché était faux.** L'écran d'accueil
          annonçait « v1.0 » depuis le début des 2.x : le numéro était figé
          dans le fichier de construction et n'a jamais suivi. Sur une
          capture, impossible de savoir quelle version avait produit le défaut
          qu'on regardait. Il est maintenant lu là où il est déjà maintenu.

          **Une même course pouvait s'inscrire cinq fois** dans le journal, en
          alternant « Bolt » et « Uber ». Deux causes conjuguées : le nom de
          l'application figurait dans la signature qui reconnaît un doublon, et
          la mémoire n'en retenait qu'une seule — une alternance A, B, A, B
          n'était donc jamais reconnue. La signature ne garde plus que les
          chiffres, et seize courses récentes sont mémorisées.

          Au passage, une carte lue par-dessus l'écran d'accueil était
          attribuée à « Launcher ». Elle revient désormais à l'application
          chauffeur trouvée parmi les fenêtres superposées.

          ## Ce que les versions précédentes corrigeaient

          Deux défauts trouvés par **une seule course réelle** — Brétigny-sur-Orge
          vers Sainte-Geneviève-des-Bois, 9,80 € pour 1,4 km d'approche et
          8,2 km de trajet, lue en direct sur Bolt.

          La lecture était parfaite : quatre champs sur quatre, 100 % de
          confiance, et 9,80 ÷ 9,6 = 1,02 €/km au centime près. Le verdict
          aussi : 18,7 €/h contre 25 visés. Mais la bulle ne disait ni l'un ni
          l'autre.

          **Le verdict était muet.** Le moteur alerte dès 45 % de temps non
          payé, et son motif attendait 50 % : deux seuils pour la même idée,
          et cette course à 47 % tombait entre les deux. Le refus le plus
          fréquent de tous — une course trop courte pour ce qu'elle mobilise —
          arrivait sans explication. Tu lis maintenant « 47 % du temps
          mobilisé n'est pas payé », et quand aucune contrainte particulière
          ne ressort, l'écart est nommé en clair : « 19 €/h pour 25 visés — le
          prix ne couvre pas le temps ».

          **La bulle réduite avait perdu l'euro/heure.** En passant
          l'euro/kilomètre devant, la version précédente l'avait fait
          disparaître du mode compact : tu voyais « 1,02 €/km · LAISSE » et
          rien qui l'explique — or 1,02 €/km a l'air correct. Elle porte
          maintenant les deux lignes, objectif compris. Le mode réduit doit
          rester décidable, sans quoi il ne sert à rien.

          Cette course est devenue un essai permanent du moteur, et c'est le
          contre-exemple qui vaut la peine d'être retenu : **1,02 €/km est
          au-dessus de la médiane d'un relevé de dix-neuf courses planifiées,
          et la course paie dix-neuf euros de l'heure.** Le refus ne vient pas
          de la distance mais du temps — douze minutes de trajet contre
          presque autant d'approche, d'attente et de retour à vide. C'est
          exactement ce que l'euro par kilomètre ne peut pas voir, et la
          raison pour laquelle il ne décide pas seul.

          ## Et, juste avant : quatre onglets

          **L'application se range en quatre onglets** — accueil, courses,
          simulateur, réglages — au lieu d'un écran unique qui défilait sur
          trois mètres, où il fallait passer devant le barème pour voir
          l'état des services et devant le simulateur pour régler le barème.

          L'**accueil** ne porte que ce qu'on regarde entre deux courses :
          est-ce que ça marche, et qu'a-t-il dit de la dernière offre. Son
          voyant distingue trois situations, et la troisième est celle qui
          compte : éteint, actif, et **autorisé mais non lié** — la panne où
          Android affiche le service comme coché alors qu'il ne reçoit plus
          rien, et où aucune offre n'arrive sans que quoi que ce soit ne le
          signale.

          Les **courses** réunissent l'historique des verdicts, trois
          compteurs de session — dont le taux de prise, qu'on ne calcule
          jamais de tête — et le comparateur de courses planifiées.

          Le **simulateur** a changé de nature. Il déformait le barème sur une
          course figée ; il déforme désormais la course sur un barème figé.
          Quatre curseurs — prix, approche, distance, durée — et le verdict se
          recalcule sous le doigt. On ne cherche plus « quel réglage me
          convient » mais « à partir de quel prix cette course-là devient
          bonne », qui est la question qu'on se pose vraiment au volant.

          **L'euro par kilomètre passe devant l'euro par heure**, dans la
          bulle, sur la pastille et dans le cockpit. Le second suppose une
          durée, que le moteur estime lui-même quand la plateforme ne
          l'annonce pas ; le premier ne suppose rien. Devant une offre qui
          laisse douze secondes, le chiffre qui ne repose sur aucune hypothèse
          mérite la grande taille.

          **Il ne décide pas pour autant.** Un plancher d'euro par kilomètre
          peut s'armer dans les réglages : c'est un veto et rien d'autre, il
          refuse une course et n'en autorise jamais une. Il reste à zéro —
          donc éteint — tant que tu ne l'as pas réglé, de sorte qu'aucun
          verdict ne bouge à l'installation de cette version.

          Le laisser éteint est d'ailleurs défendable, et c'est mesuré : sur
          le relevé de dix-neuf courses planifiées, un plancher à 1,70 €/km en
          refusait quinze, dont la troisième du classement — 32,50 € pour
          28,7 km, soit 43 €/h client devant la porte. Une course longue
          affiche mécaniquement un euro/kilomètre plus bas à rentabilité
          égale, parce qu'elle étale son temps mort sur plus de kilomètres
          payés.

          **Le coût de roulage se décompose** en carburant, usure et coûts
          fixes, réglables séparément et affichés ligne par ligne sous le
          verdict. Un total de 3,30 € se croit ou ne se croit pas ; trois
          lignes se vérifient, et se corrigent là où elles sont fausses. La
          somme d'origine reste 0,22 €/km, et si tu avais changé ce réglage,
          ta valeur est répartie dans les mêmes proportions plutôt que
          remplacée.

          **Nouvelle palette**, typographie en cinq niveaux, grille de 8. Les
          néons poussés à saturation laissent la place à des teintes qui se
          distinguent mieux entre elles : au volant, distinguer le verdict
          compte plus que le voir de loin.

          ## Et celle d'avant : le comparateur

          **Le comparateur de courses planifiées.** La version qui l'a précédé
          refusait les écrans de liste, et elle avait raison : les chiffres de
          deux courses s'y suivent dans le même texte, et les mélanger
          produisait des verdicts faux annoncés avec assurance. Refuser ne
          suffisait pas — c'est sur cet écran que se joue une matinée.

          Dix-neuf offres relevées un matin tenaient toutes entre 10:30 et
          11:00. Une seule serait faite, et l'écart entre le meilleur et le
          pire choix allait de 0,80 à 3,06 €/km.

          Le comparateur découpe la liste au lieu de la mélanger, et classe.
          **Sur le budget d'approche, pas sur le prix** : combien de
          kilomètres à vide la course supporte avant de passer sous ton
          objectif horaire. C'est le seul chiffre que la liste ne montre pas,
          et le seul qui dépende d'où tu es. Une course planifiée est tarifée
          comme si ta voiture était déjà devant la porte — sur ce relevé,
          aucune des dix-neuf ne supportait dix kilomètres d'approche, et
          trois ne tenaient pas même client devant la porte.

          Trois avertissements se posent sur les cartes, chacun tiré d'un
          piège mesuré :

          - **le péage.** Une course s'affichait 53,43 € — le premier chiffre
            que la main attrape. 13,60 € de péage sortent de ta poche, et elle
            retombe à la médiane exacte de sa propre liste ;
          - **le prix plancher.** Cinq courses portaient le prix *exactement*
            identique de 19,00 €, pour des trajets de 6,2 à 20,6 km. Même
            argent, trois fois le travail. Devant deux courses au même prix,
            prends toujours la plus courte ;
          - **la médiane**, qui situe une course dans sa propre liste plutôt
            que contre un seuil inventé.

          **Comment s'en servir** : ouvre la liste des courses planifiées dans
          ton application chauffeur et fais-la défiler normalement. Les offres
          s'ajoutent toutes seules, en silence et sans bulle — l'écran ne
          montre que deux cartes à la fois, il faut donc les accumuler. Puis
          **un appui sur la pastille** ouvre le classement de tout ce que tu
          as vu. Le bouton « Courses planifiées » de l'écran d'accueil le
          rouvre à froid.

          ## Ce que les versions d'avant avaient corrigé

          Elles ne venaient pas d'une idée mais d'un relevé : **80 verdicts
          d'une vraie journée**, exportés depuis le journal. Ils ont démenti
          trois choses qui étaient jusque-là tenues pour acquises.

          **Des chiffres ne prouvent rien.** Cinquante-cinq de ces 80 verdicts
          ne portaient sur aucune course : l'écran d'accueil, la barre d'état,
          une boîte mail, une conversation. Tous marquaient 60 points — un
          montant, deux nombres suivis de « km », une durée — au-dessus du
          seuil qui déclenchait l'arbitrage. Une offre, elle, porte une marque
          qui n'appartient qu'à elle : le bouton qui l'accepte, ou le compte à
          rebours qui l'emporte. Sans cette marque, un écran ne dépasse plus
          « ambigu », quel que soit son score. Le prix est assumé : une carte
          lue avant que son bouton ne soit dessiné n'est plus arbitrée du
          premier coup — elle l'est à la lecture suivante, quelques centièmes
          plus tard, ou d'un appui sur la pastille.

          **Une liste de courses n'est pas une course.** Sous « Demandes de
          courses planifiées », Bolt empile plusieurs offres. Quatorze
          verdicts de la journée mélangeaient le prix de l'une et la distance
          de l'autre — et s'annonçaient à 83 % de confiance. Deux sommes qui
          ne sont ni un péage, ni un bonus, ni un tarif à la minute, ce sont
          deux courses : l'écran n'est plus arbitré du tout. C'est ce refus
          que le comparateur ci-dessus complète.

          **La confiance mesurait la complétude, pas la justesse.** Les
          verdicts les plus faux de la journée étaient les seuls à 100 %,
          parce qu'un champ rempli par erreur la faisait monter là où un champ
          vide l'aurait fait descendre. Deux causes, relevées sur de vraies
          cartes Bolt : « 13.6km » écrit deux fois devenait treize kilomètres
          d'approche sur une carte qui n'en annonce aucune, et les « 5 min
          gratuites incluses dans le tarif » devenaient une durée d'approche.
          Un nombre est désormais jugé sur son voisin immédiat — « 11,7 €
          péage » n'est pas un prix — et un même nombre écrit deux fois reste
          un seul nombre. Une donnée manquante se voit ; une donnée inventée,
          non.

          **Grigny : la cause était ailleurs.** La capture brute conservée par
          le journal montre « 5 min (à l.6 km) » — le chiffre un rendu par la
          lettre L. Ce n'était pas une décimale coupée, et la couture posée
          pour elle ne pouvait rien y faire. Les sosies de chiffres sont
          maintenant redressés devant une unité.

          **« Écouter toutes les applications » ne donne plus les mêmes droits
          que la liste.** L'interface du système, le lanceur, le clavier et
          Arbitre lui-même sont écartés en toutes circonstances ; hors des
          applications cochées, un écran doit être certain et non seulement
          probable ; et la capture d'écran ne se déclenche que dans une
          application cochée — les neuf captures de la journée avaient toutes
          été prises ailleurs. Le mode reste là pour trouver le nom d'une
          application chauffeur manquante, et à éteindre ensuite.

          ## Ce que les versions récentes avaient apporté

          **La bulle se lit par étages** : la décision, puis l'argent, puis les
          contraintes, puis l'explication, puis le diagnostic. Un appui la
          réduit au verdict et à l'euro/heure, un appui long ouvre le journal,
          un glissement la déplace. **Les trois kilométrages ne sont pas
          additionnés** — course, approche, retour à vide, chacun sur sa
          ligne. **Le verdict dit pourquoi**, et **la source de lecture est
          affichée** : écran ou image.

          **Lecture en image.** Les applications chauffeur passent à des cartes
          dessinées plutôt qu'écrites, où le texte n'existe pas en tant que
          tel. Une capture est analysée sur le téléphone même, en second
          rideau seulement. Le modèle est embarqué dans l'application — aucun
          réseau, et l'image ne sort pas d'ici.

          **Veille.** Certaines surcouches constructeur arrêtent le processus,
          et le service de lecture part avec lui. Une notification permanente
          et discrète maintient l'application en vie, et prévient si la lecture
          d'écran se détache malgré tout.

          **Interface de nuit**, noir pur et verdicts en néon. **Tableau de
          santé** à six voyants, et un **simulateur à curseurs** qui recalcule
          le verdict sous le doigt.

          ## À savoir

          Build de débogage, signé avec la clé de débogage versionnée dans le
          dépôt. Elle est fixe, donc les versions suivantes s'installeront
          par-dessus celle-ci sans désinstallation et sans perte de réglages.

          Si une offre n'est pas vue, ou mal lue, le **journal** conserve le
          texte brut de ce qui a été capté et la liste des écrans écartés :
          « Copier le journal » suffit à faire remonter le cas.

          Six essais tournent sur un vrai Android à chaque modification, face
          à une fausse application chauffeur qui rejoue de vraies cartes
          d'offre. Ils établissent que l'offre affichée **en fenêtre
          flottante** — par-dessus l'écran d'accueil, un GPS ou TikTok, focus
          laissé au-dessous — est lue avec son approche et sa course, que le
          prix n'est pas confondu avec le bonus de prise en charge, qu'un
          écran de navigation ne fait surgir aucune bulle en pleine conduite,
          qu'une même course n'est annoncée qu'une fois, et qu'une carte
          **peinte** est lue quand même. La lecture prend environ 130 ms.

          Documentation complète : [`arbitre/README.md`](https://github.com/letxbrace-droid/Ningbus/blob/ETIQUETTE/arbitre/README.md)
          TEXTE
          sed -i "s/arbitre-VERSION.apk/arbitre-${version}.apk/; s|ETIQUETTE|${etiquette}|" notes.md

          # Republier la même version (relance du workflow, correctif) remplace
          # le fichier au lieu d'échouer.
          if gh release view "$etiquette" >/dev/null 2>&1; then
            gh release upload "$etiquette" "arbitre-${version}.apk" --clobber
            gh release edit "$etiquette" --notes-file notes.md
          else
            gh release create "$etiquette" "arbitre-${version}.apk" \
              --target "$GITHUB_SHA" \
              --title "Arbitre ${version}" \
              --notes-file notes.md
          fi

      - name: Rappeler le lien
        run: |
          echo "APK : https://github.com/${GITHUB_REPOSITORY}/releases/download/${etiquette}/arbitre-${version}.apk"
