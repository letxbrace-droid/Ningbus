<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="I&amp;N RUN Masse">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d7dff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="28%" cy="18%" r="70%">
      <stop offset="0" stop-color="#3d7dff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3d7dff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="512" height="512" rx="112" ry="112"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="512" height="512" fill="#0a1524"/>
