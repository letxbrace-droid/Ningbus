    <circle cx="256" cy="234" r="150" fill="none" stroke="url(#ring)" stroke-width="24"/>
    <text x="256" y="294" text-anchor="middle"
          font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="170"
          fill="#eaf3ff" letter-spacing="4">IN</text>
    <rect x="201" y="422" width="110" height="15" rx="7.5" fill="#ff6b35"/>
  </g>
