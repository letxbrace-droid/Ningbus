<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d7dff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="28%" cy="18%" r="70%">
      <stop offset="0" stop-color="#3d7dff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3d7dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0a1524"/>
  <rect width="512" height="512" fill="url(#halo)"/>
  <!-- contenu confiné dans la zone sûre (80 % centraux) des icônes maskables -->
  <circle cx="256" cy="238" r="112" fill="none" stroke="url(#ring)" stroke-width="18"/>
  <text x="256" y="283" text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="128"
        fill="#eaf3ff" letter-spacing="3">IN</text>
  <rect x="215" y="376" width="82" height="12" rx="6" fill="#ff6b35"/>
</svg>
